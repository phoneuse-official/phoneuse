name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check-public-tree.py
  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: platform/requirements.lock.txt
      - run: pip install -r platform/requirements.lock.txt
      - run: pip install pip-audit && pip-audit -r platform/requirements.lock.txt --no-deps --disable-pip
      - run: python -m compileall -q backend *.py
        working-directory: platform
      - run: python -m pytest tests -q
        working-directory: platform
        env:
          # The runner context is only available at step level.
          PHONEUSE_STATE_DIR: ${{ runner.temp }}/phoneuse-test-state
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
        working-directory: platform/web
      - run: npm audit --audit-level=moderate
        working-directory: platform/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: platform/web
