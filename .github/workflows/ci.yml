name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check-public-tree.py
  backend:
    runs-on: macos-latest
    env:
      QUNKONG_STATE_DIR: ${{ runner.temp }}/phoneuse-test-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r platform/requirements.lock.txt
      - run: pip install pip-audit && pip-audit -r platform/requirements.lock.txt --no-deps --disable-pip
      - run: python -m pytest tests -q
        working-directory: platform
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
        working-directory: platform/web
      - run: npm audit --audit-level=moderate
        working-directory: platform/web
      - run: npm run typecheck && npm run build
        working-directory: platform/web
